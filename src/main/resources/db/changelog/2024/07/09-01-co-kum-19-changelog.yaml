# meaningful only for postgresql. ignored H2-database for performance.
databaseChangeLog:
  - changeSet:
      id: co-2024-07-09-01-kum-19-1
      author: senolatac
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      dbms: postgresql # no need to run with h2-database.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: co_batch_job_instance
      changes:
        - sql:
            sql: >
              CREATE TABLE co_batch_job_instance  (
                  JOB_INSTANCE_ID BIGINT  NOT NULL PRIMARY KEY ,
                  VERSION BIGINT ,
                  JOB_NAME VARCHAR(100) NOT NULL,
                  JOB_KEY VARCHAR(32) NOT NULL,
                  constraint JOB_INST_UN unique (JOB_NAME, JOB_KEY)
              ) ;
  - changeSet:
